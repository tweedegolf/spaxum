version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /spaxum
      - /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /example/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
